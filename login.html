<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    Admin Login - SUPPLEMENT TO PROCEDURE DESCRIPTION - RayP QM-17 s3 |
    Layered Process Audit Checklist - Logistic
  </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --nav: #7f1d1d;
      --blue: #dc2626;
      --bg: #fff7f7;
      --text: #2b1717;
      --muted: #785f5f;
      --line: #ead6d6;
      --red: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: "Noto Sans Thai", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fee2e2, #fffafa);
    }

    .shell {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(127, 29, 29, 0.14);
    }

    .hero {
      padding: 52px;
      color: #fff;
      background: linear-gradient(145deg, var(--nav), #b91c1c);
    }

    .logo-box {
      display: flex;
      width: 190px;
      height: 76px;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(60, 10, 10, 0.16);
    }

    .badge {
      display: inline-block;
      margin-bottom: 26px;
      padding: 6px 10px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 35px;
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      color: #fee2e2;
      line-height: 1.8;
    }

    .login {
      padding: 48px 40px;
    }

    .login h2 {
      margin: 0 0 4px;
      font-size: 26px;
    }

    .sub {
      margin-bottom: 26px;
      color: var(--muted);
      font-size: 13px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .field input:focus {
      outline: 2px solid #fecaca;
      border-color: #ef4444;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 36px;
      height: 34px;
      font-size: 19px;
      color: var(--nav);
      cursor: pointer;
      background: transparent;
      border: 0;
      border-radius: 7px;
      transform: translateY(-50%);
    }

    .password-toggle:hover {
      background: #fee2e2;
    }

    .btn {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: var(--blue);
      border: 0;
      border-radius: 10px;
    }

    .btn:hover {
      background: #b91c1c;
    }

    .btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .err {
      min-height: 22px;
      margin-top: 10px;
      color: var(--red);
      font-size: 12px;
    }

    .demo {
      margin-top: 22px;
      padding: 12px;
      color: #6b3030;
      font-size: 11px;
      line-height: 1.7;
      background: #fff5f5;
      border-radius: 10px;
    }

    @media (max-width: 720px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 30px;
      }

      .hero h1 {
        font-size: 27px;
      }

      .login {
        padding: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <section class="hero">
      <div
        class="logo-box"
        role="img"
        aria-label="เครื่องเขียนสำหรับงานตรวจสอบ"
      >
        <svg
          width="154"
          height="58"
          viewBox="0 0 154 58"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect
            x="42"
            y="5"
            width="68"
            height="48"
            rx="7"
            fill="#fff7f7"
            stroke="#991b1b"
            stroke-width="2"
          />

          <rect
            x="60"
            y="2"
            width="32"
            height="9"
            rx="4"
            fill="#dc2626"
          />

          <path
            d="M55 20h40M55 29h30M55 38h36"
            stroke="#c77b7b"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M18 43L34 16l8 5-16 27-10 4 2-9z"
            fill="#f59e0b"
            stroke="#7f1d1d"
            stroke-width="2"
          />

          <path
            d="M34 16l4-7 8 5-4 7"
            fill="#fee2e2"
            stroke="#7f1d1d"
            stroke-width="2"
          />

          <path
            d="M118 13h20v34h-20z"
            fill="#fee2e2"
            stroke="#7f1d1d"
            stroke-width="2"
          />

          <path
            d="M122 19h12M122 25h7M122 31h12M122 37h7"
            stroke="#dc2626"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div class="badge">
        SUPPLEMENT TO PROCEDURE DESCRIPTION - RayP QM-17 s3
      </div>

      <h1>
        เข้าสู่ระบบ Admin<br>
        Logistic LPA
      </h1>

      <p>
        Layered Process Audit Checklist - Logistic<br>
        ระบบ Login สำหรับเจ้าหน้าที่ Admin เพื่อเข้าสู่ระบบหลังบ้าน
      </p>
    </section>

    <section class="login">
      <h2>Login เข้าระบบ</h2>

      <div class="sub">
        กรอกชื่อผู้ใช้และรหัสผ่านของผู้ดูแลระบบ
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>

          <input
            id="username"
            name="username"
            type="text"
            value="Kittiya.thongdee"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >

            <button
              class="password-toggle"
              id="passwordToggle"
              type="button"
              aria-label="แสดงรหัสผ่าน"
              title="แสดงรหัสผ่าน"
            >
              👁
            </button>
          </div>
        </div>

        <button class="btn" type="submit">
          เข้าสู่ระบบ
        </button>

        <div
          class="err"
          id="err"
          role="alert"
          aria-live="polite"
        ></div>
      </form>

      <div class="demo">
        หน้านี้สำหรับเจ้าหน้าที่ Admin เท่านั้น
      </div>
    </section>
  </div>

  <script>
    const ADMIN_USERNAME = "kittiya.thongdee";
    const ADMIN_PASSWORD_HASH =
      "90b84a57f64e0bb53112e42514d22cfaa2b2ef8fba7656208fcd69922beeba98";

    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");
    const errorMessage = document.getElementById("err");

    if (sessionStorage.getItem("lpa_admin") === "1") {
      window.location.replace("admin.html");
    }

    async function sha256(value) {
      const bytes = new TextEncoder().encode(value);
      const hash = await crypto.subtle.digest("SHA-256", bytes);

      return [...new Uint8Array(hash)]
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      const submitButton = loginForm.querySelector('button[type="submit"]');

      errorMessage.textContent = "";
      submitButton.disabled = true;
      submitButton.textContent = "กำลังเข้าสู่ระบบ...";

      try {
        const username = usernameInput.value.trim().toLowerCase();
        const password = passwordInput.value;
        const passwordHash = await sha256(password);

        if (
          username !== ADMIN_USERNAME ||
          passwordHash !== ADMIN_PASSWORD_HASH
        ) {
          throw new Error("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
        }

        sessionStorage.setItem("lpa_admin", "1");
        sessionStorage.setItem("lpa_admin_name", "Kittiya.thongdee");

        window.location.replace("admin.html");
      } catch (error) {
        errorMessage.textContent =
          error.message || "ไม่สามารถเข้าสู่ระบบได้";

        passwordInput.value = "";
        passwordInput.focus();
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "เข้าสู่ระบบ";
      }
    });

    passwordToggle.addEventListener("click", () => {
      const shouldShowPassword = passwordInput.type === "password";

      passwordInput.type = shouldShowPassword ? "text" : "password";
      passwordToggle.textContent = shouldShowPassword ? "🙈" : "👁";

      const label = shouldShowPassword
        ? "ซ่อนรหัสผ่าน"
        : "แสดงรหัสผ่าน";

      passwordToggle.setAttribute("aria-label", label);
      passwordToggle.title = label;
    });
  </script>
</body>
</html>
